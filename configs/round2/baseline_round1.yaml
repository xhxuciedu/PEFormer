# FROZEN round-1 baseline config (task spec §4). Do not edit.
#
# Reproduces the round-1 final model exactly: OptiPrime's official training mix,
# their 5-fold CV split structure, simplex outcome head, no ranking loss. This is
# `configs/official.yaml` with the round-1-winning overrides (--simplex-head
# --lambda-rank 0) baked in as literal values instead of CLI flags, so the frozen
# file is self-contained.
#
# Verified reproduction: five runs at this config (one per val_fold in {1..5},
# train_folds = the other four), tagged cv1_simplex .. cv5_simplex, git commit
# 04a6dbc (tag: round1-final), gave best-epoch validation Spearman:
#   fold 1: 0.9192   fold 2: 0.9173   fold 3: 0.9161   fold 4: 0.9174   fold 5: 0.9202
# 5-model ensemble of these five checkpoints, on the complete 20,509-row official
# held-out set: Spearman 0.8865 (Liu-only 0.8349, Kim-only 0.7751).
#
# To reproduce fold k: copy this file, set val_fold: k and train_folds to the
# other four members of {1,2,3,4,5}, then
#   python scripts/train/train_pilot.py --config <this> --run-name roundN_baseline_cvK --seed 20260812
# (--simplex-head/--lambda-rank are already baked in below, no CLI flags needed)

seed: 20260812

data:
  corpus: data/processed/featurized_official.npz
  vocab: data/processed/context_vocab_official.json
  test_fold: 0  # the 20,509-row official held-out set -- LOCKED, do not touch during search
  val_fold: 1   # example fold; round-2 Stage A screening fixes this fold throughout
  train_folds: [2, 3, 4, 5]

model:
  d_model: 384
  n_heads: 6
  ffn_dim: 1536
  dropout: 0.10
  n_edit_layers: 6
  n_peg_layers: 4
  n_cross_blocks: 2
  context_embed_dim: 32
  outcome_head: simplex

loss:
  lambda_rank: 0.0
  huber_beta: 0.1
  min_pair_diff: 0.02
  max_pairs_per_group: 4
  outcome_head: simplex

optim:
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_frac: 0.05
  grad_clip: 1.0

train:
  batch_size: 512
  max_epochs: 30
  early_stop_patience: 30  # round-1 used patience=30 for all final-sweep runs
  early_stop_min_warmup_epochs: 3
  precision: bf16
