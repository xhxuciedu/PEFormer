# Round-4 bagged member. Identical to the frozen round-1 baseline except for
# batch_size, which is halved so the run fits on an 11GB card (the base recipe at
# batch 512 OOMs there). Use with --bag-frac; the run seed selects the bag.
#
# The smaller batch makes these members a slightly different recipe as well as a
# different data sample. That is acceptable *here* and only here: bagged members
# exist to decorrelate, not to answer "is X better than Y", so recipe-matching is
# not required. Any run intended as a controlled architectural comparison must use
# the batch-512 configs on a large card instead.

seed: 20260812

data:
  corpus: data/processed/featurized_official.npz
  vocab: data/processed/context_vocab_official.json
  test_fold: 0
  val_fold: 1
  train_folds: [2, 3, 4, 5]

model:
  d_model: 384
  n_heads: 6
  ffn_dim: 1536
  dropout: 0.10
  n_edit_layers: 6
  n_peg_layers: 4
  n_cross_blocks: 2
  context_embed_dim: 32
  outcome_head: simplex

loss:
  lambda_rank: 0.0
  huber_beta: 0.1
  min_pair_diff: 0.02
  max_pairs_per_group: 4
  outcome_head: simplex

optim:
  lr: 2.0e-4  # scaled down with the halved batch size
  weight_decay: 0.01
  warmup_frac: 0.05
  grad_clip: 1.0

train:
  batch_size: 256
  max_epochs: 30
  early_stop_patience: 30
  early_stop_min_warmup_epochs: 3
  precision: bf16
