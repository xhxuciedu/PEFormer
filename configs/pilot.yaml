# PE-RankFormer pilot training config (task spec §22-23, §27).
seed: 20260812

data:
  corpus: data/processed/featurized_corpus.npz
  vocab: data/processed/context_vocab.json
  test_fold: 0 # locked, never touched until final evaluation
  val_fold: 1
  train_folds: [2, 3, 4]

model:
  d_model: 384
  n_heads: 6
  ffn_dim: 1536
  dropout: 0.10
  n_edit_layers: 6
  n_peg_layers: 4
  n_cross_blocks: 2
  context_embed_dim: 32

loss:
  lambda_rank: 0.25 # Model A; Model B (ablation) overrides to 0.0
  huber_beta: 0.1
  min_pair_diff: 0.02
  max_pairs_per_group: 4

optim:
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_frac: 0.05
  grad_clip: 1.0

train:
  batch_size: 512
  max_epochs: 30
  early_stop_patience: 5
  early_stop_min_warmup_epochs: 3
  precision: bf16
